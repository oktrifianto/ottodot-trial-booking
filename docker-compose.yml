# Only the database is containerized. Backend (Node) and frontend (Vite)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ottodot
      POSTGRES_PASSWORD: ottodot
      POSTGRES_DB: ottodot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottodot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
