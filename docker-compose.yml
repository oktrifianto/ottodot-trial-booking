# Only the database is containerized. Backend (Node) and frontend (Vite)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ottodot}
      POSTGRES_USER: ${POSTGRES_USER:-ottodot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ottodot}
    ports:
      - "5433:5432"  # intended to avoid conflict with my local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
